<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chi Tiêu">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Chi Tiêu Gia Đình</title>
<style>
/* ==========================================================================
   Chi Tiêu Gia Đình — hệ thống thiết kế
   Token (biến CSS) → thành phần (Button / Chip / Segmented / IconButton / Card…)
   Màu & thang số theo Tailwind (gray · teal · emerald · rose).
   Mọi giá trị màu, cỡ chữ, bo góc, khoảng cách, bóng, lớp chồng đều lấy từ :root.
   ========================================================================== */
:root{
  /* màu nền / chữ */
  --bg:#f6f7f9;--card:#fff;--tx:#111827;--mut:#6b7280;--line:#eef0f3;
  /* màu thương hiệu & ngữ nghĩa */
  --pri:#0f766e;--onpri:#fff;--on-grad:#fff;
  --inc:#047857;--exp:#e11d48;--warn:#f59e0b;--ok:#10b981;--info:#3b82f6;--off:#9ca3af;
  --brand-rgb:15,118,110;--accent-rgb:16,185,129;
  --grad-brand:linear-gradient(135deg,#0f766e,#047857);
  --grad-hero:linear-gradient(135deg,#115e59 0%,#0f766e 55%,#047857 100%);
  --glass:rgba(255,255,255,.78);--scrim:rgba(10,15,20,.5);
  --tint:rgba(var(--brand-rgb),.07);--focus:rgba(var(--brand-rgb),.18);
  --fx-1:rgba(255,255,255,.07);--fx-2:rgba(255,255,255,.12);--fx-3:rgba(0,0,0,.16);--fx-4:rgba(255,255,255,.24);
  --toast-bg:#111827;--toast-tx:#fff;--toast-link:#5eead4;
  /* bo góc */
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r-pill:999px;
  /* cỡ chữ */
  --fs-xs:12px;--fs-sm:14px;--fs-md:16px;--fs-lg:18px;--fs-xl:24px;--fs-2xl:clamp(28px,9vw,36px);
  --fs-icon:22px;--fs-icon-lg:32px;
  /* khoảng cách (thang 4) */
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;
  /* vùng chạm tối thiểu */
  --tap:44px;--tap-lg:48px;
  /* bóng */
  --sh-1:0 1px 2px rgba(16,24,40,.04),0 6px 20px -6px rgba(16,24,40,.08);
  --sh-2:0 14px 34px -10px rgba(16,24,40,.32);
  --sh-3:0 30px 60px -12px rgba(0,0,0,.5);
  --sh-sheet:0 -10px 40px rgba(0,0,0,.2);
  --sh-seg:0 1px 3px rgba(16,24,40,.14);
  --sh-brand:0 10px 20px -10px rgba(var(--brand-rgb),.8);
  --sh-hero:0 16px 34px -12px rgba(var(--brand-rgb),.6);
  /* lớp chồng */
  --z-bg:-1;--z-nav:20;--z-sheet:50;--z-dialog:80;--z-lock:100;--z-toast:200;
  /* chuyển động */
  --ease:cubic-bezier(.2,.8,.2,1);--ease-sheet:cubic-bezier(.32,.72,0,1)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0f14;--card:#141a22;--tx:#eef1f5;--mut:#8b95a5;--line:#222a35;
  --pri:#2dd4bf;--onpri:#04211d;--inc:#34d399;--exp:#fb7185;
  --grad-hero:linear-gradient(135deg,#083d3a 0%,#0f766e 60%,#047857 100%);
  --glass:rgba(20,26,34,.78);
  --toast-bg:#f1f5f9;--toast-tx:#0f172a;--toast-link:#0f766e;
  --sh-1:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);
  --sh-2:0 14px 34px -10px rgba(0,0,0,.7);
}}

/* ---------- nền tảng ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs-md)/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:300px;background:radial-gradient(120% 100% at 50% -30%,rgba(var(--accent-rgb),.20),transparent 70%);pointer-events:none;z-index:var(--z-bg)}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--s-4)) var(--s-4) calc(124px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:var(--s-2)}
h1{font-size:var(--fs-xl);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em}
#subt{margin:var(--s-1) 0 0;color:var(--mut);font-size:var(--fs-sm)}
#subt:empty{display:none}
small{font-size:var(--fs-xs)}
label{display:block;font-size:var(--fs-sm);color:var(--mut);margin:var(--s-4) 0 var(--s-2);font-weight:500}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input:focus-visible,select:focus-visible{outline:0}

/* ---------- Button (.btn · .pri · .danger · .ghost · .sm) ---------- */
button{font-family:inherit;cursor:pointer;transition:transform .15s var(--ease),background-color .2s,color .2s,box-shadow .2s,border-color .2s}
button:active{transform:scale(.95)}
.btn{border:0;border-radius:var(--r-md);padding:var(--s-3) var(--s-4);min-height:var(--tap-lg);font-size:var(--fs-md);font-weight:600;background:var(--bg);color:var(--tx);width:100%;margin-top:var(--s-2)}
.btn.pri{background:var(--grad-brand);color:var(--on-grad);box-shadow:var(--sh-brand)}
.btn.danger{color:var(--exp)}
.btn.ghost{background:transparent}
.btn.sm{width:auto;min-height:var(--tap);padding:var(--s-2) var(--s-4);font-size:var(--fs-sm);margin:0}

/* ---------- IconButton (.ib) ---------- */
.ib{border:1px solid var(--line);background:var(--card);color:var(--tx);width:var(--tap);height:var(--tap);border-radius:var(--r-md);font-size:var(--fs-lg);box-shadow:var(--sh-1)}

/* ---------- Chip (.chip · .on · .more · .q) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:var(--s-2);margin:var(--s-2) 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:var(--r-pill);padding:var(--s-2) var(--s-3);font-size:var(--fs-sm);box-shadow:0 1px 2px rgba(16,24,40,.04)}
button.chip{min-height:var(--tap)}
.chip.on{background:var(--grad-brand);color:var(--on-grad);border-color:transparent;box-shadow:var(--sh-brand)}
.chip.more{color:var(--pri);border-style:dashed}
.chip.q{flex:none;font-weight:600;background:var(--bg)}
span.chip{display:inline-flex;align-items:center;min-height:var(--tap);padding-right:0}
.chip .x{border:0;background:none;color:inherit;font:inherit;min-width:var(--tap);min-height:var(--tap);padding:0;opacity:.6}
.qk{display:flex;gap:var(--s-2);margin:var(--s-1) 0 var(--s-2);overflow-x:auto}

/* ---------- Segmented control (.seg · .sm) ---------- */
.seg{position:relative;display:flex;background:var(--bg);border-radius:var(--r-md);padding:var(--s-1);gap:var(--s-1);margin:var(--s-2) 0}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);min-height:var(--tap);padding:0 var(--s-2);border-radius:var(--r-sm);font-size:var(--fs-md);font-weight:600}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh-seg)}
.seg button.on.exp{color:var(--exp)}.seg button.on.inc{color:var(--inc)}
.seg.sm{margin:0;padding:2px;flex:none}.seg.sm button{min-height:var(--tap);padding:0 var(--s-3);font-size:var(--fs-sm);white-space:nowrap}

/* ---------- Trạng thái đồng bộ (.sync) ---------- */
.sync{position:relative;display:inline-flex;align-items:center;gap:var(--s-2);min-height:var(--tap);border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:var(--fs-xs);font-weight:600;padding:0 var(--s-3);border-radius:var(--r-pill);box-shadow:var(--sh-1);margin-top:2px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.sync.ok i{background:var(--ok)}.sync.warn i{background:var(--warn)}.sync.err{color:var(--exp)}.sync.err i{background:var(--exp)}
.sync.busy i{background:var(--info);animation:blink 1s infinite}

/* ---------- Card & nội dung ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--s-4);margin:var(--s-3) 0;box-shadow:var(--sh-1)}
.card h3{margin:0 0 var(--s-2);font-size:var(--fs-md);font-weight:650;letter-spacing:-.01em}
.hero{position:relative;overflow:hidden;border:0;color:var(--on-grad);background:var(--grad-hero);box-shadow:var(--sh-hero)}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:var(--fx-2)}
.hero::before{width:190px;height:190px;right:-60px;top:-80px}
.hero::after{width:130px;height:130px;left:-40px;bottom:-60px;background:var(--fx-1)}
.hero-in{position:relative;z-index:1}
.hero-in>small{font-size:var(--fs-sm);opacity:.9}
.hero .big{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.03em;margin:2px 0 var(--s-3);font-variant-numeric:tabular-nums}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.pill{display:flex;gap:var(--s-3);align-items:center;background:var(--fx-3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:var(--r-lg);padding:var(--s-3);min-width:0}
.pill small{display:block;white-space:nowrap}
.pill b{font-size:var(--fs-md);font-variant-numeric:tabular-nums;white-space:nowrap}
.ar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-md);background:var(--fx-4);flex:none}
.spark{display:block;width:100%;height:46px;margin-top:var(--s-4)}
.spl{font-size:var(--fs-xs);opacity:.9;margin-top:2px}
.card.day{margin-top:var(--s-1);padding:var(--s-1) var(--s-4)}
.amt.muted{color:var(--mut)}
.hsplit{display:flex;gap:var(--s-2) var(--s-4);flex-wrap:wrap;font-size:var(--fs-sm);margin:calc(-1*var(--s-1)) 0 var(--s-3);opacity:.95}
.hsplit b{font-variant-numeric:tabular-nums}
.bud[data-act]{cursor:pointer}
.fsub{display:block;color:var(--mut);margin-top:var(--s-1);font-size:var(--fs-xs)}
.fundh{margin:var(--s-2) 0 0}.fundh.over{color:var(--exp)}
.chip[disabled]{opacity:.5;cursor:default}
.hint.over{color:var(--exp)}
.btot{margin:var(--s-2) 0 var(--s-1)}.btot .kpi b{font-size:var(--fs-md)}
.row.btotal{border-top:1px solid var(--line);border-bottom:0}
.chip .cn{border:0;background:none;color:inherit;font:inherit;padding:0;min-height:var(--tap);text-align:left}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s-2)}
.kpi small{color:var(--mut);display:block}
.kpi b{font-size:var(--fs-lg);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.inc{color:var(--inc)}.exp{color:var(--exp)}.neg{color:var(--exp)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:var(--s-3) 0}
.mnav b{font-size:var(--fs-lg);letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row[data-act]{cursor:pointer;transition:background-color .15s}
.row[data-act]:active{background:var(--tint)}
.ic{width:42px;height:42px;border-radius:var(--r-md);background:var(--bg);display:grid;place-items:center;font-size:var(--fs-icon);flex:none}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:600}
.mid small{color:var(--mut);display:block;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.dayh{display:flex;justify-content:space-between;color:var(--mut);font-size:var(--fs-sm);margin:var(--s-4) var(--s-2) 2px;font-weight:500}
.bud{margin:var(--s-3) 0}.bt{display:flex;justify-content:space-between;font-size:var(--fs-sm);margin-bottom:var(--s-2)}
.bar{height:9px;border-radius:var(--r-pill);background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;border-radius:var(--r-pill);transform-origin:left}
.empty{text-align:center;color:var(--mut);padding:var(--s-5) 0}
.empty .em{font-size:var(--fs-icon-lg);margin-bottom:var(--s-1);display:inline-block;animation:float 3s ease-in-out infinite}
.legend .row{padding:var(--s-2) 0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.hint{font-size:var(--fs-sm);color:var(--mut);margin:var(--s-2) 0}
.sec{margin:var(--s-5) var(--s-2) 0;font-size:var(--fs-xs);color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.chd{display:flex;justify-content:space-between;align-items:center;gap:var(--s-3)}
.chd h3{margin:0}

/* ---------- Biểu đồ (đơn vị SVG, tỉ lệ theo khung 340 / 120) ---------- */
.donut{width:176px;height:176px;display:block;margin:var(--s-2) auto}
.dt1{font-size:8px;fill:var(--mut)}.dt2{font-size:12px;font-weight:700;fill:var(--tx)}
.bars{width:100%;height:auto}.ax{font-size:11px;fill:var(--mut)}
.leg2{display:flex;gap:var(--s-4);font-size:var(--fs-xs);color:var(--mut);justify-content:center;margin-top:var(--s-1)}

/* ---------- Ô nhập ---------- */
input,select{width:100%;min-height:var(--tap);padding:var(--s-3) var(--s-4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);color:var(--tx);font-size:var(--fs-md);font-family:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--focus)}
input.big{font-size:var(--fs-2xl);font-weight:700;text-align:right;padding:var(--s-3) 38px var(--s-3) var(--s-3);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
input.big.expense{color:var(--exp)}input.big.income{color:var(--inc)}
.amtwrap{position:relative;margin:var(--s-2) 0}
.amtwrap .cur{position:absolute;right:var(--s-4);top:50%;transform:translateY(-50%);font-size:var(--fs-icon);color:var(--mut)}

/* ---------- Thanh điều hướng ---------- */
nav{position:fixed;left:var(--s-3);right:var(--s-3);bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-2);z-index:var(--z-nav)}
nav div{display:flex;align-items:center;padding:0 var(--s-1)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:var(--s-2) 0;min-height:var(--tap-lg);font-size:var(--fs-xs);font-weight:500}
nav button span{display:block;font-size:var(--fs-icon);line-height:1.1;filter:grayscale(.9);opacity:.7;transition:filter .25s,opacity .25s}
nav button.on{color:var(--pri);font-weight:700}
nav button.on span{filter:none;opacity:1;animation:pop .45s var(--ease)}
nav button.add{flex:none;width:60px;height:60px;border-radius:50%;background:var(--grad-brand);color:var(--on-grad);font-size:var(--fs-icon-lg);font-weight:300;line-height:1;margin:-26px var(--s-2) 0;padding:0;box-shadow:var(--sh-brand);animation:glow 3s ease-in-out infinite}
nav button.add:active{transform:scale(.9) rotate(90deg)}

/* ---------- Form (sheet) & hộp thoại ---------- */
#sheet{position:fixed;inset:0;z-index:var(--z-sheet);display:none}
#sheet.on{display:block}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--s-3) 0 0;max-height:94%;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-sheet)}
.panel:focus{outline:0}
.pbody{overflow:auto;padding:0 var(--s-4) var(--s-3);flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.actions{display:flex;gap:var(--s-3);padding:var(--s-3) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.actions .btn{margin:0}.actions .btn.pri{flex:2}.actions .btn:not(.pri){flex:1}
.grab{width:42px;height:5px;border-radius:var(--r-sm);background:var(--line);margin:0 auto var(--s-3)}
#dlg{position:fixed;inset:0;z-index:var(--z-dialog);display:none;align-items:center;justify-content:center;padding:var(--s-5)}
#dlg.on{display:flex}
.dbox{position:relative;width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--card);border-radius:var(--r-xl);padding:var(--s-5) var(--s-5) var(--s-4);box-shadow:var(--sh-3);animation:popin .32s var(--ease) both}
.dbox h3{margin:0;font-size:var(--fs-lg);letter-spacing:-.01em}
.dbox p{margin:var(--s-2) 0 0;color:var(--mut);font-size:var(--fs-sm)}
.drow{display:flex;gap:var(--s-3);margin-top:var(--s-4)}.drow .btn{margin:0}.drow .btn.pri,.drow .btn.danger{flex:1.4}.drow .btn:first-child{flex:1}
.dbox>.btn{margin-top:var(--s-3)}

/* ---------- Khóa PIN ---------- */
#lock{position:fixed;inset:0;z-index:var(--z-lock);background:radial-gradient(120% 80% at 50% 0%,rgba(var(--accent-rgb),.22),var(--bg) 70%);display:none;flex-direction:column;align-items:center;justify-content:center}
#lock.on{display:flex;animation:fade .3s both}
.pins{display:flex;gap:var(--s-4);margin:var(--s-5) 0 var(--s-6)}.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri);transition:background-color .15s,transform .15s}.pins i.f{background:var(--pri);transform:scale(1.15)}
.pins.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:var(--s-4)}
.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:var(--fs-xl);box-shadow:var(--sh-1)}

/* ---------- Thông báo (toast) ---------- */
#toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translate(-50%,18px) scale(.95);background:var(--toast-bg);color:var(--toast-tx);padding:var(--s-3) var(--s-4);border-radius:var(--r-lg);font-size:var(--fs-sm);font-weight:500;z-index:var(--z-toast);max-width:90%;display:flex;align-items:center;gap:var(--s-2);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);box-shadow:var(--sh-2)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.act{pointer-events:auto}
#toast .ck{width:20px;height:20px;flex:none}
#toast .ck path{stroke-dasharray:24;stroke-dashoffset:24}
#toast.show .ck path{animation:tick .45s .12s ease forwards}
#toast .btn.ghost{color:var(--toast-link);font-weight:700;margin-left:var(--s-1)}
body.cover #app,body.cover nav{filter:blur(24px)}

/* ---------- chuyển động ---------- */
@keyframes blink{50%{opacity:.3}}
@keyframes popin{from{opacity:0;transform:scale(.92) translateY(12px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes segd{from{stroke-dasharray:0 var(--C)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28) translateY(-3px)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes tick{to{stroke-dashoffset:0}}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes glow{0%,100%{box-shadow:var(--sh-brand),0 0 0 0 rgba(var(--accent-rgb),.35)}50%{box-shadow:var(--sh-brand),0 0 0 11px rgba(var(--accent-rgb),0)}}
#view.anim>*{animation:rise .45s var(--ease) both}

<script>
'use strict';
const KEY='qltc.v1',PINKEY='qltc.pin',SYNCKEY='qltc.sync';
const PAL=['#0f766e','#f59e0b','#3b82f6','#ef4444','#8b5cf6','#ec4899','#14b8a6','#84cc16','#f97316','#6366f1','#06b6d4','#a855f7','#eab308','#64748b'];
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const walletIcon=n=>{const f=String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").toLowerCase();return /tien mat|cash/.test(f)?"💵":/vi dien tu|momo|zalo|vnpay|shopee|paypal|ewallet/.test(f)?"📱":/tiet kiem/.test(f)?"🐖":/ngan hang|bank|the |tpb|acb|vcb|techcom|mb\b|vib|bidv|agri/.test(f)?"🏦":"👛"};
const fmt=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n));
const money=n=>fmt(n)+' đ';
const short=n=>{const a=Math.abs(n),s=n<0?'-':'';if(a>=1e9)return s+(a/1e9).toFixed(1).replace(/\.0$/,'')+' tỷ';if(a>=1e6)return s+(a/1e6).toFixed(1).replace(/\.0$/,'')+' tr';if(a>=1e3)return s+Math.round(a/1e3)+'k';return s+Math.round(a)};
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const curYM=()=>todayStr().slice(0,7);
const shiftYM=(ym,d)=>{let [y,m]=ym.split('-').map(Number);m+=d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
const DOWF=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const catColor=n=>{let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const cnt=(v,pre='',suf='',f='n')=>`<span class="cnt" data-v="${v}" data-pre="${pre}" data-suf="${suf}" data-f="${f}">${pre}${(f==='s'?short:fmt)(v)}${suf}</span>`;
function countUp(root){
  root.querySelectorAll('.cnt').forEach(el=>{
    const v=+el.dataset.v,pre=el.dataset.pre||'',suf=el.dataset.suf||'',f=el.dataset.f==='s'?short:fmt;
    if(!v)return;const t0=performance.now(),D=500;
    const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=pre+f(v*e)+suf;if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function spark(L,ym){
  const [y,m]=ym.split('-').map(Number),dim=new Date(y,m,0).getDate(),last=ym===curYM()?new Date().getDate():dim;
  const per=Array(dim).fill(0);L.filter(t=>t.type==='expense').forEach(t=>per[+t.date.slice(8)-1]+=t.amount);
  let c=0;const cum=per.slice(0,last).map(v=>c+=v);if(c===0||last<2)return '';
  const W=300,H=46,pts=cum.map((v,i)=>[i/(last-1)*W,H-5-(v/c)*(H-12)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="${d}L${W} ${H}L0 ${H}Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div class="spl">Chi tích lũy trong tháng</div>`;
}

const mk=(a)=>a.map(([n,i])=>({n,i}));
const defaults=()=>({people:['Chồng','Vợ'],
  catExp:mk([['Ăn uống','🍜'],['Chợ & siêu thị','🛒'],['Đi lại','🛵'],['Nhà ở','🏠'],['Điện nước','💡'],['Internet & điện thoại','📱'],['Sức khỏe','💊'],['Con cái','🧸'],['Giáo dục','📚'],['Mua sắm','🛍️'],['Giải trí','🎬'],['Hiếu hỉ & quà tặng','🎁'],['Du lịch','✈️'],['Khác','📦']]),
  catInc:mk([['Lương','💼'],['Thưởng','🎉'],['Kinh doanh','🏪'],['Lãi & đầu tư','📈'],['Khác','💰']]),
  wallets:[{n:'Tiền mặt',open:0},{n:'Ngân hàng',open:0},{n:'Ví điện tử',open:0}],
  budgets:{},recurring:[],funds:[],updated:0});
function load(){const raw=localStorage.getItem(KEY);try{const s=JSON.parse(raw);if(s&&Array.isArray(s.tx)){s.set=Object.assign(defaults(),s.set||{});return s}}catch(e){if(raw){try{localStorage.setItem(KEY+'.bak',raw)}catch(_){}}}return {tx:[],set:defaults(),lastSync:0,lastPush:0}}
let S=load();

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Không lưu được vào bộ nhớ máy (đầy hoặc bị chặn). Hãy xuất sao lưu.')}};
const getSync=()=>{try{return JSON.parse(localStorage.getItem(SYNCKEY))||{url:'',secret:''}}catch(e){return {url:'',secret:''}}};

/* ---------- dữ liệu ---------- */
const live=()=>S.tx.filter(t=>!t.deleted);
const cats=type=>type==='income'?S.set.catInc:S.set.catExp;
const catInfo=(type,n)=>cats(type).find(c=>c.n===n)||{n,i:'🏷️'};
const person=i=>S.set.people[i]??'?';
const cmpTx=(a,b)=>b.date.localeCompare(a.date)||b.updated-a.updated;
const sum=(L,type)=>L.filter(t=>t.type===type).reduce((a,t)=>a+t.amount,0);
const inMonth=ym=>live().filter(t=>t.date.startsWith(ym));
const walletBal=w=>{let b=w.open||0;for(const t of live()){if(t.type==='fund')continue;if(t.wallet===w.n)b+=t.type==='income'?t.amount:-t.amount;if(t.type==='transfer'&&t.cat===w.n)b+=t.amount}return b};
/* ---------- Quỹ: phần tiền dành riêng cho một việc (chỉ ghi sổ, tiền vẫn nằm trong ví) ---------- */
const allFunds=()=>S.set.funds||(S.set.funds=[]);
const funds=()=>allFunds().filter(f=>!f.deleted);
const fundById=id=>funds().find(f=>f.id===id);
/* Cấu hình quỹ theo từng giai đoạn: mỗi lần đổi mức cấp/danh mục/cách tính chỉ áp dụng từ tháng đổi trở đi. */
const fundHist=f=>f.hist&&f.hist.length?f.hist:[{from:f.from,monthly:f.monthly||0,cats:f.cats||[],mode:f.mode||'acc'}];
const fundCfg=(f,m)=>{const H=fundHist(f);let c=H[0];for(const h of H)if(h.from<=m)c=h;return c};
const fundOfCat=(c,ym=curYM())=>funds().find(f=>(!f.from||ym>=f.from)&&(fundCfg(f,ym).cats||[]).includes(c));
const nMonths=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+m2-m1+1};
/* Trạng thái quỹ trong tháng ym: mang sang + cấp + nạp/rút − đã chi = còn lại. skip: bỏ qua 1 giao dịch (khi đang sửa). */
function fundMonth(f,ym,skip){
  if(!f.from||ym<f.from)return null;
  const n=nMonths(f.from,ym),M=[],top=Array(n).fill(0),sp=Array(n).fill(0);
  for(let k=0,m=f.from;k<n;k++,m=shiftYM(m,1))M.push(fundCfg(f,m));
  for(const t of S.tx){
    if(t.deleted||t.id===skip)continue;
    const m=t.date.slice(0,7);if(m<f.from||m>ym)continue;const k=nMonths(f.from,m)-1;
    if(t.type==='fund'&&t.cat===f.id)top[k]+=t.amount;
    else if(t.type==='expense'&&(M[k].cats||[]).includes(t.cat))sp[k]+=t.amount;
  }
  let left=0,r=null;
  for(let k=0;k<n;k++){
    const c=M[k],acc=c.mode!=='reset',carry=acc?(k===0?(f.open||0):left):0,give=c.monthly||0,avail=carry+give+top[k];
    left=avail-sp[k];r={carry,give,top:top[k],spent:sp[k],avail,left,mode:acc?'acc':'reset'};
  }
  return r;
}
/* ---------- Ngân sách dự tính: mỗi dòng gồm 1 hoặc nhiều danh mục chi, số tiền dự chi mỗi tháng.
   Đổi số tiền/danh mục chỉ áp dụng từ tháng đổi; xóa dòng chỉ ẩn từ tháng xóa trở đi. ---------- */
const allBL=()=>S.set.blines||(S.set.blines=[]);
const blActive=(b,ym)=>!b.deleted&&ym>=b.from&&(!b.to||ym<b.to);
const bls=()=>allBL().filter(b=>blActive(b,curYM()));
const blHist=b=>b.hist&&b.hist.length?b.hist:[{from:b.from,amount:b.amount||0,cats:b.cats||[]}];
const blCfg=(b,m)=>{const H=blHist(b);let c=H[0];for(const h of H)if(h.from<=m)c=h;return c};
/* Ngân sách cũ (mỗi danh mục một con số) → dòng ngân sách. Mã cố định để 2 máy chuyển đổi ra cùng một dòng. */
function migrateBudgets(){
  if(Array.isArray(S.set.blines))return;
  const u=S.set.updated||0;
  S.set.blines=Object.entries(S.set.budgets||{}).filter(([,v])=>v>0).map(([c,v])=>({id:'b-'+c,n:c,i:catInfo('expense',c).i,amount:v,cats:[c],from:'2000-01',hist:[{from:'2000-01',amount:v,cats:[c]}],updated:u}));
}
function budgetMonth(ym){
  const ex={};for(const t of live())if(t.type==='expense'&&t.date.startsWith(ym))ex[t.cat]=(ex[t.cat]||0)+t.amount;
  const covered=new Set();
  const cnt={};for(const t of live())if(t.type==='expense'&&t.date.startsWith(ym))cnt[t.cat]=(cnt[t.cat]||0)+1;
  const rows=allBL().filter(b=>blActive(b,ym)).map(b=>{const c=blCfg(b,ym);let sp=0,n=0;for(const k of c.cats||[]){if(covered.has(k))continue;covered.add(k);sp+=ex[k]||0;n+=cnt[k]||0}const amt=c.amount||0;return {b,amt,spent:sp,left:amt-sp,n}});
  let out=0;for(const k in ex)if(!covered.has(k))out+=ex[k];
  const amt=rows.reduce((a,r)=>a+r.amt,0),spent=rows.reduce((a,r)=>a+r.spent,0);
  return {rows,amt,spent,left:amt-spent,out};
}
/* Nhật ký đổi tên danh mục (đồng bộ giữa 2 máy). Máy nhận được sẽ tự đổi theo,
   kể cả giao dịch nó vừa ghi bằng tên cũ hoặc danh sách danh mục bị máy kia ghi đè. */
const allRen=()=>S.set.renames||(S.set.renames=[]);
function renameMap(type){
  const M={};
  for(const r of allRen().filter(r=>!r.deleted&&r.type===type).sort((a,b)=>a.at-b.at)){for(const k in M)if(M[k]===r.from)M[k]=r.to;M[r.from]=r.to;M[r.to]=r.to}
  for(const k in M)if(M[k]===k)delete M[k];return M;
}
function applyRenames(){
  let setCh=false,txCh=0;const now=Date.now();
  for(const type of ['expense','income']){
    const M=renameMap(type);if(!Object.keys(M).length)continue;const L=cats(type);
    for(let i=L.length-1;i>=0;i--){const t=M[L[i].n];if(!t)continue;if(L.some(x=>x.n===t))L.splice(i,1);else L[i].n=t;setCh=true}
    for(const x of S.tx)if(!x.deleted&&x.type===type&&M[x.cat]){x.cat=M[x.cat];x.updated=now;txCh++}
    for(const r of S.set.recurring)if(r.type===type&&M[r.cat]){r.cat=M[r.cat];setCh=true}
    if(type==='expense'){
      const rp=a=>{let c=false;const o=(a||[]).map(x=>M[x]?(c=true,M[x]):x);return [o,c]};
      for(const f of [...allFunds(),...allBL()]){const [a,c]=rp(f.cats);if(c){f.cats=a;setCh=true}
        if(f.hist)f.hist=f.hist.map(h=>{const [a2,c2]=rp(h.cats);if(c2)setCh=true;return c2?{...h,cats:a2}:h})}
      for(const k of Object.keys(S.set.budgets||{}))if(M[k]){S.set.budgets[M[k]]=S.set.budgets[k];delete S.set.budgets[k];setCh=true}
    }
  }
  return {setCh,txCh};
}
/* Đổi tên danh mục: đổi luôn trong giao dịch, giao dịch định kỳ, quỹ và ngân sách. Trả về số giao dịch đã đổi. */
function renameCat(type,o,n){
  if(o===n)return 0;const c=cats(type).find(x=>x.n===o);if(!c)return 0;c.n=n;
  allRen().push({id:uid(),type,from:o,to:n,at:Date.now()});
  const now=Date.now();let k=0;
  for(const t of S.tx)if(!t.deleted&&t.type===type&&t.cat===o){t.cat=n;t.updated=now;k++}
  for(const r of S.set.recurring)if(r.type===type&&r.cat===o)r.cat=n;
  if(type==='expense'){
    const rp=a=>(a||[]).map(x=>x===o?n:x);
    for(const L of [allFunds(),allBL()])for(const f of L){if(f.cats)f.cats=rp(f.cats);if(f.hist)f.hist=f.hist.map(h=>({...h,cats:rp(h.cats)}));if(L!==allFunds()&&f.n===o)f.n=n}
    if(S.set.budgets&&o in S.set.budgets){S.set.budgets[n]=S.set.budgets[o];delete S.set.budgets[o]}
  }
  return k;
}
const fundAlloc=()=>funds().reduce((a,f)=>{const s=fundMonth(f,curYM());return a+(s?Math.max(0,s.left):0)},0);
function upsertTx(t){t.updated=Date.now();const i=S.tx.findIndex(x=>x.id===t.id);if(i>=0)S.tx[i]=t;else S.tx.push(t);save();scheduleSync()}
/* Cài đặt đồng bộ theo từng phần (tên, danh mục, ví, ngân sách, định kỳ) và từng quỹ,
   để hai máy sửa khác chỗ cùng lúc không ghi đè nhau. */
const SF=['people','catExp','catInc','wallets','budgets','recurring'];
let setBase={};
const fKey=f=>JSON.stringify({...f,updated:0});
const IL=['funds','blines','renames'];
/* Bản cài đặt cũ chưa có dấu thời gian từng phần: lấy thời điểm sửa chung làm mốc. */
function ensureMt(x){const u=x.updated||0,mt=x.mt||(x.mt={});for(const k of SF)if(!(k in mt))mt[k]=u;for(const k of IL)for(const f of x[k]||[])if(!f.updated)f.updated=u;return x}
function snapBase(){setBase={};for(const k of SF)setBase[k]=JSON.stringify(S.set[k]);for(const k of IL)for(const f of S.set[k]||[])setBase[k+':'+f.id]=fKey(f)}
function stampSet(now){
  const mt=S.set.mt||(S.set.mt={});
  for(const k of SF){const j=JSON.stringify(S.set[k]);if(setBase[k]!==j){mt[k]=now;setBase[k]=j}}
  for(const k of IL)for(const f of S.set[k]||[]){const j=fKey(f);if(setBase[k+':'+f.id]!==j){f.updated=now;setBase[k+':'+f.id]=j}}
}
function touchSet(){const now=Date.now();stampSet(now);S.set.updated=now;save();scheduleSync()}
/* Gộp cài đặt từ máy kia: mỗi phần lấy bên sửa sau; quỹ gộp theo từng quỹ. Trả về true nếu bản gộp khác bản trên máy chủ. */
function mergeSet(r){
  ensureMt(r);ensureMt(S.set);const L=S.set,lm=L.mt,rm=r.mt,lu=L.updated||0,ru=r.updated||0,o=Object.assign(defaults(),L,{mt:{...lm}});
  let differs=false;
  for(const k of SF){
    if(r[k]===undefined){differs=true;continue}
    const lt=lm[k],rt=rm[k];
    if(rt>lt){o[k]=r[k];o.mt[k]=rt}else if(JSON.stringify(L[k])!==JSON.stringify(r[k]))differs=true;
  }
  for(const k of IL){
    const map=new Map();
    for(const f of r[k]||[])map.set(f.id,f);
    for(const f of L[k]||[]){const x=map.get(f.id);if(!x||f.updated>x.updated){map.set(f.id,f);if(!x||fKey(f)!==fKey(x))differs=true}}
    o[k]=[...map.values()];
  }
  o.updated=Math.max(lu,ru);
  S.set=o;snapBase();return differs;
}

function runRecurring(){
  const now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1,td=now.getDate();let ch=false;
  for(const r of S.set.recurring){
    let [y,m]=r.from.split('-').map(Number);
    while(y<cy||(y===cy&&m<=cm)){
      const dim=new Date(y,m,0).getDate(),d=Math.min(r.day,dim);
      if(!(y===cy&&m===cm)||d<=td){
        const id=`rec-${r.id}-${y}-${pad(m)}`;
        if(!S.tx.some(t=>t.id===id)){S.tx.push({id,date:`${y}-${pad(m)}-${pad(d)}`,type:r.type,amount:r.amount,cat:r.cat,wallet:r.wallet,who:r.who,note:r.note||'(Định kỳ)',updated:Date.now(),deleted:false});ch=true}
      }
      m++;if(m>12){m=1;y++}
    }
  }
  if(ch){save();scheduleSync()}
}

/* ---------- UI state ---------- */
const NOW=new Date();
let ui={tab:'home',ym:curYM(),rp:'month',ry:NOW.getFullYear(),rm:NOW.getMonth()+1,who:'all',tw:'all',q:'',cm:'exp'};
let fm=null;

const mnav=(ym,p)=>`<div class="mnav"><button class="ib" data-act="${p}prev">‹</button><b>Tháng ${+ym.slice(5)}/${ym.slice(0,4)}</b><button class="ib" data-act="${p}next">›</button></div>`;
const whoChips=(cur,act)=>`<div class="chips"><button class="chip ${cur==='all'?'on':''}" data-act="${act}" data-v="all">Cả hai</button>${S.set.people.map((p,i)=>`<button class="chip ${cur===i?'on':''}" data-act="${act}" data-v="${i}">${esc(p)}</button>`).join('')}</div>`;
function txRow(t){
  if(t.type==='transfer')return `<div class="row" data-act="edit" data-id="${t.id}"><div class="ic">🔁</div><div class="mid"><b>${esc(t.wallet)} → ${esc(t.cat)}</b><small>Chuyển tiền · ${esc(person(t.who))}${t.note?' · '+esc(t.note):''}</small></div><div class="amt muted">${fmt(t.amount)}</div></div>`;
  if(t.type==='fund'){const f=fundById(t.cat);return `<div class="row" data-act="delFundTx" data-id="${t.id}"><div class="ic">${f?f.i:'🐖'}</div><div class="mid"><b>${t.amount>=0?'Nạp thêm':'Rút bớt'} quỹ ${esc(f?f.n:'(đã xóa)')}</b><small>Chỉ ghi sổ quỹ${t.note?' · '+esc(t.note):''}</small></div><div class="amt muted">${t.amount>=0?'+':'-'}${fmt(Math.abs(t.amount))}</div></div>`}
  const c=catInfo(t.type,t.cat);return `<div class="row" data-act="edit" data-id="${t.id}"><div class="ic" style="background:${catColor(t.cat)}22">${c.i}</div><div class="mid"><b>${esc(t.cat)}</b><small>${esc(t.wallet)} · ${esc(person(t.who))}${t.note?' · '+esc(t.note):''}</small></div><div class="amt ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div></div>`}

function budgetCard(){
  const B=budgetMonth(ui.ym),mo=+ui.ym.slice(5);
  if(!B.rows.length)return ui.ym===curYM()?`<div class="card"><h3>Ngân sách tháng ${mo}</h3><div class="hint">Đặt số tiền dự chi cho từng danh mục để biết mình còn dư hay đã vượt.</div><button class="btn" data-act="addBL">＋ Tạo ngân sách</button></div>`:'';
  const over=B.left<0;let fc='';
  if(ui.ym===curYM()){const d=NOW.getDate(),dim=new Date(+ui.ym.slice(0,4),mo,0).getDate();
    if(d>=7&&d<dim&&B.spent>0){const proj=B.rows.reduce((a,r)=>a+(r.n>=3?Math.round(r.spent/d*dim):r.spent),0),diff=B.amt-proj;
      if(diff<0||B.left<0)fc=`<div class="hint over">📈 Nếu tiếp tục chi như ${d} ngày qua, cuối tháng có thể vượt ngân sách khoảng ${short(Math.abs(diff))}.</div>`;else fc=`<div class="hint">📈 Nếu tiếp tục chi như ${d} ngày qua, cuối tháng còn dư khoảng ${short(diff)}.</div>`}}
  return `<div class="card"><div class="chd"><h3>Ngân sách tháng ${mo}</h3><button class="btn ghost sm" data-act="addBL">＋ Thêm</button></div>
  <div class="grid3 btot"><div class="kpi"><small>Dự chi</small><b>${short(B.amt)}</b></div><div class="kpi"><small>Đã chi</small><b>${short(B.spent)}</b></div><div class="kpi"><small>${over?'Đã vượt':'Còn dư'}</small><b class="${over?'neg':'inc'}">${short(Math.abs(B.left))}</b></div></div>${fc}
  ${B.rows.map(r=>{const p=r.amt>0?r.spent/r.amt*100:(r.spent>0?101:0);
    return `<div class="bud" data-act="editBL" data-id="${esc(r.b.id)}" aria-label="${esc(r.b.n)}: ${r.left<0?'vượt':'còn'} ${fmt(Math.abs(r.left))} đồng"><div class="bt"><span>${r.b.i} ${esc(r.b.n)}</span><b class="${r.left<0?'neg':''}">${r.left<0?'vượt '+fmt(-r.left):'còn '+fmt(r.left)} đ</b></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>100?'var(--exp)':p>80?'var(--warn)':'var(--pri)'}"></i></div><small class="fsub">Dự chi ${short(r.amt)} · đã chi ${short(r.spent)}</small></div>`}).join('')}
  ${B.out>0?`<div class="bud" data-act="tab" data-v="list"><div class="bt"><span>🏷️ Ngoài ngân sách</span><b>${fmt(B.out)} đ</b></div><small class="fsub">Các khoản chi chưa thuộc dòng ngân sách nào</small></div>`:''}
  </div>`;
}

    const p=s.avail>0?s.spent/s.avail*100:(s.spent>0?101:0);
    return `<div class="bud" data-act="fundTx" data-id="${f.id}" aria-label="Quỹ ${esc(f.n)}, còn ${fmt(s.left)} đồng"><div class="bt"><span>${f.i} ${esc(f.n)}</span><b class="${s.left<0?'neg':''}">${fmt(s.left)} đ</b></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>100?'var(--exp)':p>80?'var(--warn)':'var(--pri)'}"></i></div><small class="fsub">Đã chi ${fmt(s.spent)} / có ${fmt(s.avail)} đ${s.mode==='reset'?' · làm mới mỗi tháng':s.carry>0?` · tháng trước để dành ${short(s.carry)}`:''}</small></div>`}).join('')}<div class="hint">Chạm vào một quỹ để nạp thêm hoặc rút bớt.</div></div>`;
}

  const q=ui.q.trim().toLowerCase();
  let L=(q?live():inMonth(ui.ym)).filter(t=>(ui.tw==='all'||t.who===ui.tw)&&(!q||(t.note+' '+t.cat+' '+t.wallet).toLowerCase().includes(q))).sort(cmpTx);
  if(!L.length)return '<div class="empty">Không tìm thấy giao dịch nào. Thử từ khóa hoặc bộ lọc khác.</div>';

/* ---------- Báo cáo ---------- */
function periodMonths(p,y,m){if(p==='year')return Array.from({length:12},(_,i)=>`${y}-${pad(i+1)}`);if(p==='quarter'){const q=Math.floor((m-1)/3);return [0,1,2].map(i=>`${y}-${pad(q*3+i+1)}`)}return [`${y}-${pad(m)}`]}
function shiftP(p,y,m,d){if(p==='year')return {y:y+d,m};let k=p==='quarter'?3*d:d;m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return {y,m}}
const pLabel=(p,y,m)=>p==='year'?`Năm ${y}`:p==='quarter'?`Quý ${Math.floor((m-1)/3)+1}/${y}`:`Tháng ${m}/${y}`;
function calc(p,y,m,who){const ms=periodMonths(p,y,m);const L=live().filter(t=>ms.includes(t.date.slice(0,7))&&(who==='all'||t.who===who));return {ms,L,inc:sum(L,'income'),exp:sum(L,'expense')}}
function donut(items){const tot=items.reduce((a,i)=>a+i.v,0);if(!tot)return '<div class="empty">Kỳ này chưa có giao dịch.</div>';const R=42,C=2*Math.PI*R;let off=0;
  const segs=items.map((i,k)=>{const l=i.v/tot*C;const s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${i.c}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)" style="--C:${C};animation-delay:${k*70}ms"/>`;off+=l;return s}).join('');
  return `<svg viewBox="0 0 120 120" class="donut">${segs}<text x="60" y="58" text-anchor="middle" class="dt1">Tổng chi</text><text x="60" y="71" text-anchor="middle" class="dt2">${short(tot)}</text></svg>`}
function bars(g,mode){
  const both=mode==='both',W=340,H=156,pl=4,pb=22,pt=18,n=g.length;
  const mx=Math.max(1,...g.flatMap(x=>both?[x.inc,x.exp]:[x.exp]));
  const sw=(W-pl*2)/n,bw=Math.max(2,Math.min(both?14:20,sw*(both?.38:.6)));
  let s=`<line x1="0" x2="${W}" y1="${pt}" y2="${pt}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="0" y="${pt-5}" class="ax">${short(mx)}</text><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>`;
  const hh=v=>v>0?Math.max(2,(H-pb-pt)*v/mx):0;
  g.forEach((x,i)=>{const cx=pl+sw*i+sw/2,hi=hh(x.inc),he=hh(x.exp),dl=Math.min(i*22,520);
    if(both)s+=`<rect x="${cx-bw-.5}" y="${H-pb-hi}" width="${bw}" height="${hi}" rx="2" fill="var(--inc)" style="animation-delay:${dl}ms"/><rect x="${cx+.5}" y="${H-pb-he}" width="${bw}" height="${he}" rx="2" fill="var(--exp)" style="animation-delay:${dl}ms"/>`;
    else s+=`<rect x="${cx-bw/2}" y="${H-pb-he}" width="${bw}" height="${he}" rx="3" fill="var(--exp)" style="animation-delay:${dl}ms"/>`;
    if(n<=12||i%5===0||i===n-1)s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" class="ax">${x.label}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="bars">${s}</svg>${both?'<div class="leg2"><span><b class="inc">■</b> Thu</span><span><b class="exp">■</b> Chi</span></div>':''}`}
function catBreak(L,type){const m={};L.filter(t=>t.type===type).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,v],i)=>({n,v,c:PAL[i%PAL.length]}))}
function vReport(){
  const {ry:y,rm:m,rp:p,who}=ui,R=calc(p,y,m,who),pv=shiftP(p,y,m,-1),P=calc(p,pv.y,pv.m,who);
  let groups;
  if(p==='month'){const dim=new Date(y,m,0).getDate();groups=Array.from({length:dim},(_,i)=>{const d=`${y}-${pad(m)}-${pad(i+1)}`,a=R.L.filter(t=>t.date===d);return {label:String(i+1),inc:sum(a,'income'),exp:sum(a,'expense')}})}
  else groups=R.ms.map(ym=>{const a=R.L.filter(t=>t.date.startsWith(ym));return {label:'T'+ +ym.slice(5),inc:sum(a,'income'),exp:sum(a,'expense')}});
  const cy=curYM(),elapsed=p==='month'?(R.ms[0]===cy?+todayStr().slice(8):new Date(y,m,0).getDate()):Math.max(1,R.ms.filter(x=>x<=cy).length);
  const avg=R.exp/(R.ms[0]>cy?1:elapsed),avgL=p==='month'?'Chi TB mỗi ngày':'Chi TB mỗi tháng';
  const save=R.inc-R.exp,rate=R.inc>0?Math.round(save/R.inc*100):null;
  const ongoing=R.ms.includes(curYM()),diff=R.exp-P.exp;
  const cmp=P.exp>0?(ongoing?` · Kỳ trước chi ${short(P.exp)}`:` · Chi ${diff>=0?'tăng':'giảm'} ${short(Math.abs(diff))}${P.exp>=100000?` (${Math.round(Math.abs(diff)/P.exp*100)}%)`:''} so với kỳ trước`):'';
  const ce=catBreak(R.L,'expense'),ci=catBreak(R.L,'income');
  const byPerson=S.set.people.map((n,i)=>({n,e:sum(R.L.filter(t=>t.who===i),'expense'),i:sum(R.L.filter(t=>t.who===i),'income')}));
  const legend=ce.map(c=>`<div class="row"><span class="dot" style="background:${c.c}"></span><div class="mid"><b>${catInfo('expense',c.n).i} ${esc(c.n)}</b></div><div class="amt">${fmt(c.v)} <small style="color:var(--mut)">${Math.round(c.v/R.exp*100)}%</small></div></div>`).join('');
  const incList=ci.map(c=>`<div class="row"><div class="ic" style="background:${c.c}22">${catInfo('income',c.n).i}</div><div class="mid"><b>${esc(c.n)}</b></div><div class="amt inc">+${fmt(c.v)}</div></div>`).join('');
  return `<div class="seg">${[['month','Tháng'],['quarter','Quý'],['year','Năm']].map(([k,l])=>`<button class="${p===k?'on':''}" data-act="rp" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="mnav"><button class="ib" data-act="rprev" aria-label="Kỳ trước">‹</button><b>${pLabel(p,y,m)}</b><button class="ib" data-act="rnext" aria-label="Kỳ sau">›</button></div>
  ${whoChips(who,'rwho')}
  <div class="card"><div class="grid3"><div class="kpi"><small>Thu</small><b class="inc">${cnt(R.inc,'+','','s')}</b></div><div class="kpi"><small>Thực tiêu</small><b class="exp">${cnt(R.exp,'-','','s')}</b></div><div class="kpi"><small>Chênh lệch</small><b class="${save<0?'neg':'inc'}">${cnt(save,'','','s')}</b></div></div>
  <div class="hint">${rate!==null?`Tiết kiệm ${rate}% thu nhập · `:''}${avgL}: ${fmt(avg)} đ${cmp}</div></div>
  ${budgetReport(R.ms)}
  ${fundReport(R.ms)}
  <div class="card" id="chartCard">${(repCtx={p,groups,has:R.L.length>0},chartInner())}</div>
  <div class="card"><h3>Chi tiêu theo danh mục</h3>${donut(ce.map(c=>({v:c.v,c:c.c})))}<div class="legend">${legend}</div></div>
  ${ci.length?`<div class="card"><h3>Nguồn thu</h3>${incList}</div>`:''}
  <div class="card"><h3>Theo từng người</h3>${byPerson.map(x=>`<div class="row"><div class="ic">👤</div><div class="mid"><b>${esc(x.n)}</b><small>Thu ${fmt(x.i)} đ</small></div><div class="amt exp">-${fmt(x.e)}</div></div>`).join('')}</div>
  <button class="btn" data-act="csvPeriod">⬇️ Xuất CSV kỳ này</button>`;
}

function budgetReport(ms){
  const mm=ms.filter(m=>m<=curYM());if(!mm.length)return '';
  const acc=new Map();let out=0;
  for(const m of mm){const B=budgetMonth(m);out+=B.out;for(const r of B.rows){const a=acc.get(r.b.id)||{b:r.b,amt:0,spent:0};a.amt+=r.amt;a.spent+=r.spent;acc.set(r.b.id,a)}}
  const rows=[...acc.values()];if(!rows.length)return '';
  const amt=rows.reduce((a,r)=>a+r.amt,0),sp=rows.reduce((a,r)=>a+r.spent,0);
  const dv=v=>v>=0?`<span class="inc">+${fmt(v)}</span>`:`<span class="neg">−${fmt(-v)}</span>`;
  return `<div class="card"><h3>So với ngân sách</h3>${rows.map(r=>`<div class="row"><div class="ic">${r.b.i}</div><div class="mid"><b>${esc(r.b.n)}</b><small>Dự ${short(r.amt)} · chi ${short(r.spent)}</small></div><div class="amt">${dv(r.amt-r.spent)}</div></div>`).join('')}
  <div class="row btotal"><div class="ic">Σ</div><div class="mid"><b>Tổng</b><small>Dự ${short(amt)} · chi ${short(sp)}</small></div><div class="amt">${dv(amt-sp)}</div></div>
  <div class="hint">+ là còn dư, − là chi vượt so với dự tính.${out>0?` Ngoài ngân sách đã chi ${fmt(out)} đ.`:''}</div></div>`;
}
function fundReport(ms){
  const cy=curYM();
  const rows=funds().map(f=>{const mm=ms.filter(m=>f.from&&m>=f.from&&m<=cy);if(!mm.length)return null;
    let give=0,spent=0,acc=false,end=null;for(const m of mm){end=fundMonth(f,m);give+=end.give+end.top;spent+=end.spent;if(end.mode==='acc')acc=true}
    return {f,give,spent,left:end.left,acc}}).filter(Boolean);
  if(!rows.length)return '';
  const accR=rows.filter(r=>r.acc),saved=accR.reduce((a,r)=>a+r.give-r.spent,0);
  return `<div class="card"><h3>Quỹ trong kỳ</h3>${rows.map(r=>`<div class="row"><div class="ic">${r.f.i}</div><div class="mid"><b>${esc(r.f.n)}</b><small>Cấp ${short(r.give)} · đã chi ${short(r.spent)}</small></div><div class="amt ${r.left<0?'neg':''}">${fmt(r.left)}</div></div>`).join('')}
  <div class="hint">Số bên phải là tiền còn trong quỹ cuối kỳ.${accR.length?` Các quỹ cộng dồn ${saved>=0?'tích trữ thêm':'giảm'} ${fmt(Math.abs(saved))} đ trong kỳ.`:''}</div></div>`;
}

function applyOcr(r){
  const names=t=>cats(t).map(c=>c.n);
  fm.type=r.type;fm.amount=r.amount||0;if(r.date)fm.date=r.date;fm.note=r.note||'';
  const key=(r.note||'').trim().toLowerCase();
  const prev=key&&live().find(t=>t.type===r.type&&(t.note||'').trim().toLowerCase()===key&&names(r.type).includes(t.cat));
  fm.cat=prev?prev.cat:BankOCR.guessCat(r.hay||r.raw||r.note||'',r.type,names(r.type));
  const bank=S.set.wallets.find(w=>/ngan hang|bank|the |card/.test(BankOCR.fold(w.n)));if(bank)fm.wallet=bank.n;
  const warn=[...(r.warn||[])];
  if(r.internal&&r.type==='expense'&&S.set.wallets.length>1){fm.type='transfer';fm.cat='';fm.to=(S.set.wallets.find(w=>w.n!==fm.wallet)||{}).n||'';fm.note=fm.note==='Chuyển giữa tài khoản của mình'?'':fm.note;warn.splice(0,warn.length,...warn.filter(w=>!/chính bạn/.test(w)))}
  if(r.amount&&r.date&&live().some(t=>t.date===r.date&&t.amount===r.amount))warn.push('Đã có giao dịch cùng ngày và số tiền này, hãy kiểm tra để tránh ghi trùng.');
  fm.ocr=Object.assign(fm.ocr||{},{busy:false,warn,items:null,msg:r.amount?(fm.type==='transfer'?'Đã điền thành Chuyển tiền giữa tài khoản của bạn. Kiểm tra ví nhận rồi bấm Lưu.':fm.cat?'Đã điền. Kiểm tra lại rồi bấm Lưu.':'Đã điền số tiền. Hãy chọn danh mục.'):'Chưa đọc được số tiền, hãy nhập tay.'});
  renderForm();
}
async function runOcr(file){
  if(!fm||!file)return;
  try{
    ocrMsg('Đang chuẩn bị…',1);await loadBank();
    const text=await BankOCR.read(file,m=>ocrMsg(m,1));
    const r=BankOCR.parse(text);
    if(r.mode==='list'){
      if(!r.items.length)throw new Error('Không thấy giao dịch nào trong ảnh.');
      fm.ocr=Object.assign(fm.ocr||{},{busy:false,warn:[],items:r.items,msg:'Ảnh có nhiều giao dịch. Chạm vào giao dịch muốn ghi:'});renderForm();
    }else applyOcr(r);
  }catch(e){ocrMsg('Không đọc được ảnh: '+(e&&e.message||e),0);toast('Không đọc được ảnh. Thử ảnh rõ hơn hoặc nhập tay.')}
}

async function download(name,text,mime){
  const blob=new Blob([text],{type:mime});const file=new File([blob],name,{type:mime});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function csv(L){const q=v=>{let x=String(v??'');if(/^[=+\-@\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};

let syncing=false,syncT,lastMsg='';
const syncMsg=()=>lastMsg||(S.lastSync?'Đã đồng bộ trước đó.':'Chưa đồng bộ.');
function setStatus(m){lastMsg=m;const g=$('#sy-msg');if(g)g.textContent=m;updSync()}
function scheduleSync(){updSync();clearTimeout(syncT);syncT=setTimeout(()=>doSync(false),2500)}
function merge(j){
  const m=new Map(S.tx.map(t=>[t.id,t]));
  for(const t of j.txs||[]){const o=m.get(t.id);if(!o||t.updated>o.updated)m.set(t.id,{id:String(t.id),date:t.date,type:t.type,amount:+t.amount,cat:t.cat,wallet:t.wallet,who:+t.who||0,note:t.note||'',updated:+t.updated,deleted:t.deleted===true||t.deleted==='TRUE'||t.deleted==='true'})}
  S.tx=[...m.values()];
}
async function doSync(manual){
  const cfg=getSync();
  if(!cfg.url||!cfg.secret){if(manual)toast('Nhập link và mật khẩu đồng bộ ở tab Cài đặt');return}
  if(!navigator.onLine){setStatus('Đang offline. Sẽ đồng bộ khi có mạng');return}
  if(syncing)return;syncing=true;setStatus('Đang đồng bộ…');const start=Date.now();
  try{
    const call=async body=>{const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
      let j;try{j=await r.json()}catch(_){throw new Error('Apps Script không trả dữ liệu hợp lệ. Hãy triển khai lại với quyền "Bất kỳ ai".')}if(!j.ok)throw new Error(j.error||'Lỗi không rõ');return j};
    const dirty=setDirty();
    // 1) Gửi giao dịch mới, nhận về giao dịch + cài đặt hiện có trên Sheet
    const j=await call({secret:cfg.secret,since:S.lastSync,txs:S.tx.filter(t=>t.updated>S.lastPush),settings:null});
    merge(j);
    // 2) Gộp cài đặt theo từng phần; nếu máy này có thay đổi máy kia chưa có thì gửi bản đã gộp
    let differs=j.settings?mergeSet(j.settings):S.set.updated>0;
    const ar=applyRenames();if(ar.setCh){stampSet(Date.now());differs=true}if(ar.txCh)setTimeout(scheduleSync,0);
    if(dirty||differs){if(differs||!j.settings){S.set.updated=Math.max(Date.now(),(j.settings&&j.settings.updated||0)+1)}
      }
    const ver=S.set.updated;if(differs)await call({secret:cfg.secret,since:Date.now(),txs:[],settings:S.set});
    S.setPushed=ver;S.lastPush=start;S.lastSync=Math.max(0,j.now-120000);save();
    syncErr='';setStatus('Đồng bộ lúc '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}));
    if(!fm&&!document.activeElement?.matches('input,select'))render();
    if(manual)toast('Đồng bộ xong',1);
  }catch(e){syncErr=(e instanceof TypeError)?'Không kết nối được tới Google Sheet. Kiểm tra mạng, link Apps Script và quyền truy cập "Bất kỳ ai".':e.message;setStatus('Lỗi: '+syncErr);if(manual)toast(syncErr)}
  syncing=false;updSync();
}

/* ---------- Khóa PIN ---------- */
let pinBuf='';
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':qltc'));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}
function showLock(){if(!localStorage.getItem(PINKEY))return;pinBuf='';drawLock();$('#lock').classList.add('on')}
function drawLock(msg){
  $('#lock').innerHTML=`<div style="font-size:44px">🔒</div><div style="margin-top:6px;color:var(--mut)">${msg||'Nhập mã PIN'}</div><div class="pins">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-act="pin" data-v="${k}">${k}</button>`).join('')}</div>`;
}
async function pinKey(k){
  if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
  drawLock();
  if(pinBuf.length===4){
    if(await sha(pinBuf)===localStorage.getItem(PINKEY)){$('#lock').classList.remove('on');pinBuf=''}
    else{pinBuf='';drawLock('Sai mã PIN, thử lại');const pe=$('#lock .pins');if(pe)pe.classList.add('shake');navigator.vibrate&&navigator.vibrate(200)}
  }
}

  else{document.body.classList.remove('cover');if(hiddenAt&&Date.now()-hiddenAt>60000)showLock();runRecurring();doSync(false)}

  else if((t.id==='fd-m'||t.id==='fd-o')&&fd){const d=t.value.replace(/\D/g,'').slice(0,12);t.value=d?fmt(+d):'';fd[t.id==='fd-m'?'monthly':'open']=+d||0}
  else if(t.classList.contains('dmoney')){const d=t.value.replace(/\D/g,'').slice(0,12);t.value=d?fmt(+d):''}
  else if(t.id==='f-note')fm.note=t.value;
  else if(t.id==='s-q'){ui.q=t.value;$('#listBody').innerHTML=listBody()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-wallet')fm.wallet=t.value;
  else if(t.id==='f-to')fm.to=t.value;
  else if(t.id==='f-date'){fm.date=t.value;updFundHint()}
  else if(t.id==='f-day')fm.day=+t.value||1;
  else if(t.id==='p0'||t.id==='p1'){S.set.people[+t.id[1]]=t.value.trim()||(t.id==='p0'?'Chồng':'Vợ');touchSet()}
  else if(t.id==='sy-url'||t.id==='sy-sec'){localStorage.setItem(SYNCKEY,JSON.stringify({url:$('#sy-url').value.trim(),secret:$('#sy-sec').value.trim()}));updSync()}
  else if(t.id==='ocr-file'){const f=t.files[0];t.value='';if(f)runOcr(f)}
  else if(t.id==='restore'){
    const f=t.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx)||!d.set||!d.tx.every(t=>t&&typeof t.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&['expense','income','transfer','fund'].includes(t.type)&&Number.isFinite(+t.amount)&&Number.isFinite(+t.updated)))throw 0;if(!(await ask('Khôi phục dữ liệu?',`Thay toàn bộ dữ liệu trên máy bằng ${d.tx.length} giao dịch trong file sao lưu.`,'Khôi phục',false)))return;S={tx:d.tx,set:Object.assign(defaults(),d.set),lastSync:0,lastPush:0};{const now=Date.now();S.set.updated=now;S.set.mt=Object.fromEntries(SF.map(k=>[k,now]));IL.forEach(k=>(S.set[k]||[]).forEach(f=>f.updated=now));migrateBudgets();snapBase()}save();render();toast('Đã khôi phục',1);scheduleSync()}catch(err){toast('Không đọc được file sao lưu. Chọn file .json do app xuất ra.')}finally{t.value=''}};
    r.readAsText(f);
  }
});

/* ---------- Hộp thoại trong app (thay prompt/confirm) ---------- */
function dlg({title,msg='',fields=[],ok='Lưu',cancel='Hủy',danger=false,extra=null,extraCls='danger'}){
  return new Promise(res=>{
    const el=$('#dlg');
    el.innerHTML=`<div class="scrim" data-dlg="x"></div><div class="dbox" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${msg?`<p>${esc(msg)}</p>`:''}${fields.map((f,i)=>`<label>${esc(f.label)}</label><input data-f="${i}" class="${f.money?'dmoney':''}" ${f.money?'inputmode="numeric"':''} ${f.pin?'inputmode="numeric" maxlength="4" type="password"':''} placeholder="${esc(f.ph||(f.money?'0':''))}" value="${esc(f.money?(f.value?fmt(f.value):''):(f.value??''))}" autocomplete="off">`).join('')}<div class="drow"><button class="btn" data-dlg="x">${esc(cancel)}</button><button class="btn ${danger?'danger':'pri'}" data-dlg="ok">${esc(ok)}</button></div>${extra?`<button class="btn ${extraCls}" data-dlg="extra">${esc(extra)}</button>`:''}</div>`;
    el.classList.add('on');fitVV();
    const first=el.querySelector('input');if(first)first.focus();
    const done=v=>{el.classList.remove('on');el.innerHTML='';el.onclick=null;el.onkeydown=null;el.style.top='';el.style.height='';el.style.bottom='';res(v)};
    el.onclick=e=>{const b=e.target.closest('[data-dlg]');if(!b)return;const k=b.dataset.dlg;if(k==='x')return done(null);
      const vals=[...el.querySelectorAll('input')].map((inp,i)=>fields[i].money?(parseInt(inp.value.replace(/\D/g,''))||0):inp.value.trim());
      done(k==='extra'?{extra:true,vals}:{vals})};
    el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const b=el.querySelector('[data-dlg=ok]');if(b)b.click()}};
  });
}
const ask=(title,msg,ok='Xóa',danger=true)=>dlg({title,msg,ok,danger}).then(r=>!!r);

/* ---------- Lần đầu mở app: hỏi tên và số dư các ví ---------- */
async function welcome(){
  if(S.onboarded||S.tx.length||S.set.updated||getSync().url)return;
  const ws=S.set.wallets;
  const r=await dlg({title:'Chào mừng bạn 👋',msg:'Nhập tên hai bạn và số dư hiện có trong từng ví để số liệu chính xác ngay từ đầu.',
    fields:[{label:'Tên người 1',value:S.set.people[0]},{label:'Tên người 2',value:S.set.people[1]},...ws.map(w=>({label:`Số dư "${w.n}" (đ)`,money:1,value:w.open||0}))],
    ok:'Bắt đầu',cancel:'Để sau',extra:'Tôi đã dùng app trên máy khác',extraCls:''});
  S.onboarded=true;save();
  if(!r)return;
  if(r.extra){ui.tab='set';render(true);toast('Nhập link Apps Script và mật khẩu để lấy dữ liệu về');return}
  S.set.people=[r.vals[0]||'Chồng',r.vals[1]||'Vợ'];ws.forEach((w,i)=>w.open=r.vals[2+i]||0);touchSet();render(true);
}

/* ---------- Trạng thái đồng bộ ---------- */
let syncErr='';
const setDirty=()=>S.set.updated>Math.max(S.lastPush,S.setPushed||0);
const pending=()=>S.tx.filter(t=>t.updated>S.lastPush).length+(setDirty()?1:0);
function updSync(){
  const e=$('#sync');if(!e)return;const c=getSync();let cls,txt;
  if(!c.url||!c.secret){cls='off';txt='Chưa nối Sheet'}
  else if(syncing){cls='busy';txt='Đang đồng bộ…'}
  else if(syncErr){cls='err';txt='Lỗi · chạm để thử lại'}
  else if(pending()){const n=pending();cls='warn';txt=navigator.onLine?`${n} chưa gửi`:`Offline · ${n} chưa gửi`}
  else{cls='ok';txt='Đã đồng bộ'}
  e.className='sync '+cls;e.innerHTML='<i></i>'+txt;
}

/* ---------- Biểu đồ thu/chi (chuyển đổi Chi | Thu & Chi) ---------- */
let repCtx={p:'month',groups:[],has:false};
function chartInner(){const c=repCtx;return `<div class="chd"><h3>${ui.cm==='exp'?'Chi':'Thu – chi'} theo ${c.p==='month'?'ngày':'tháng'}</h3><div class="seg sm"><button class="${ui.cm==='exp'?'on':''}" data-act="cm" data-v="exp">Chi</button><button class="${ui.cm==='both'?'on':''}" data-act="cm" data-v="both">Thu &amp; chi</button></div></div>${c.has?bars(c.groups,ui.cm):'<div class="empty">Kỳ này chưa có giao dịch.</div>'}`}

/* ---------- Bàn phím iOS che form: bám theo vùng nhìn thấy ---------- */
function fitVV(){const vv=window.visualViewport;if(!vv)return;for(const id of ['sheet','dlg']){const e=document.getElementById(id);if(e&&e.classList.contains('on')){e.style.top=vv.offsetTop+'px';e.style.height=vv.height+'px';e.style.bottom='auto'}}}
if(window.visualViewport){visualViewport.addEventListener('resize',fitVV);visualViewport.addEventListener('scroll',fitVV)}

/* ---------- Khởi động ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ---------- Tự cập nhật: iPhone hay giữ app cũ trong bộ nhớ, nên mỗi lần mở lại app thì kiểm tra bản mới ---------- */
const APP_VER='13';
async function checkUpdate(){
  if(!navigator.onLine||!location.protocol.startsWith('http'))return;
  try{
    const j=await (await fetch('version.json',{cache:'no-store'})).json();if(!j||!j.v||j.v===APP_VER)return;
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.update().catch(()=>{});
    const busy=$('#sheet').classList.contains('on')||$('#dlg').classList.contains('on')||$('#lock').classList.contains('on');
    if(!busy&&sessionStorage.getItem('qltc.rl')!==j.v){sessionStorage.setItem('qltc.rl',j.v);location.reload();return}
    toast('Đã có bản mới của app',0,{label:'Cập nhật',fn:()=>location.reload()});
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
setTimeout(checkUpdate,3000);
ensureMt(S.set);migrateBudgets();snapBase();if(applyRenames().setCh)touchSet();
showLock();runRecurring();render(true);updSync();doSync(false);welcome();
window.addEventListener('online',()=>doSync(false));

/* ---------- Trợ năng: bàn phím, vai trò, Esc ---------- */
function a11y(){document.querySelectorAll('[data-act]:not(button):not(a):not(input):not(.scrim)').forEach(el=>{if(!el.hasAttribute('role')){el.setAttribute('role','button');el.tabIndex=0}})}
{let q=0;new MutationObserver(()=>{if(!q){q=1;queueMicrotask(()=>{q=0;a11y()})}}).observe(document.body,{childList:true,subtree:true});a11y()}
document.addEventListener('keydown',e=>{
  const dl=$('#dlg'),sh=$('#sheet');
  if(e.key==='Escape'){if(dl&&dl.classList.contains('on')){const x=dl.querySelector('[data-dlg=x]');if(x){x.click();e.preventDefault()}}else if(sh&&sh.classList.contains('on')){const x=sh.querySelector('.scrim');if(x){x.click();e.preventDefault()}}return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
});
